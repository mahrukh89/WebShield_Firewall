<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0d1117"/>
  <text x="600" y="40" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700">WebShield Firewall — System Architecture</text>
  <text x="600" y="64" text-anchor="middle" fill="#8b949e" font-size="14">Bash (iptables) + Python (Flask) Implementation</text>

  <!-- top row -->
  <g font-size="13" fill="#e6edf3">
    <rect x="40" y="100" width="150" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="115" y="140" text-anchor="middle" font-weight="600">Internet</text>

    <rect x="250" y="90" width="170" height="90" rx="8" fill="#3a1f12" stroke="#f0883e"/>
    <text x="335" y="130" text-anchor="middle" font-weight="600">Firewall</text>
    <text x="335" y="150" text-anchor="middle" fill="#8b949e" font-size="12">(Packet Filtering)</text>

    <rect x="480" y="90" width="200" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="580" y="115" text-anchor="middle" font-weight="600">Network Interfaces</text>
    <rect x="500" y="130" width="70" height="30" rx="6" fill="#123822" stroke="#3fb950"/>
    <text x="535" y="150" text-anchor="middle" font-size="12">eth0 (WAN)</text>
    <rect x="590" y="130" width="70" height="30" rx="6" fill="#123822" stroke="#3fb950"/>
    <text x="625" y="150" text-anchor="middle" font-size="12">eth1 (LAN)</text>

    <rect x="740" y="100" width="180" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="830" y="130" text-anchor="middle" font-weight="600">Internal Network</text>
    <text x="830" y="150" text-anchor="middle" fill="#8b949e" font-size="12">Clients / Servers</text>
  </g>

  <!-- arrows top row -->
  <g stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)">
    <line x1="190" y1="135" x2="248" y2="135"/>
    <line x1="420" y1="135" x2="478" y2="135"/>
    <line x1="680" y1="135" x2="738" y2="135"/>
  </g>

  <!-- middle boxes -->
  <g font-size="13" fill="#e6edf3">
    <rect x="60" y="260" width="260" height="200" rx="10" fill="#0b2a45" stroke="#58a6ff"/>
    <text x="190" y="290" text-anchor="middle" font-weight="700">Packet Filtering Layer</text>
    <text x="190" y="308" text-anchor="middle" fill="#8b949e" font-size="12">nftables / iptables</text>
    <text x="80" y="335" font-size="12">• Filter chains</text>
    <text x="80" y="355" font-size="12">• NAT</text>
    <text x="80" y="375" font-size="12">• Port forwarding</text>
    <text x="80" y="395" font-size="12">• Stateful inspection</text>

    <rect x="360" y="260" width="260" height="200" rx="10" fill="#3a2f0b" stroke="#d29922"/>
    <text x="490" y="290" text-anchor="middle" font-weight="700">Rule Management</text>
    <text x="490" y="308" text-anchor="middle" fill="#8b949e" font-size="12">firewall.sh (Bash)</text>
    <text x="380" y="335" font-size="12">• Add / delete rules</text>
    <text x="380" y="355" font-size="12">• Enable / disable</text>
    <text x="380" y="375" font-size="12">• Flush rules</text>
    <text x="380" y="395" font-size="12">• Logging setup</text>

    <rect x="660" y="260" width="260" height="200" rx="10" fill="#0f2e1a" stroke="#3fb950"/>
    <text x="790" y="290" text-anchor="middle" font-weight="700">Web Management UI</text>
    <text x="790" y="308" text-anchor="middle" fill="#8b949e" font-size="12">web.py (Python + Flask)</text>
    <text x="680" y="335" font-size="12">• Dashboard / status</text>
    <text x="680" y="355" font-size="12">• Add / edit / delete rules</text>
    <text x="680" y="375" font-size="12">• View logs</text>
    <text x="680" y="395" font-size="12">• System monitor</text>

    <rect x="360" y="530" width="260" height="130" rx="10" fill="#2e1030" stroke="#a371f7"/>
    <text x="490" y="560" text-anchor="middle" font-weight="700">Logging &amp; Monitoring</text>
    <text x="380" y="590" font-size="12">• Traffic logs</text>
    <text x="380" y="610" font-size="12">• Blocked connections</text>
    <text x="380" y="630" font-size="12">• Alerts</text>
  </g>

  <!-- connecting lines -->
  <g stroke="#8b949e" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="335" y1="180" x2="335" y2="258"/>
    <line x1="320" y1="360" x2="358" y2="360"/>
    <line x1="620" y1="360" x2="658" y2="360"/>
    <line x1="190" y1="460" x2="490" y2="528"/>
    <line x1="790" y1="460" x2="490" y2="528"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <text x="600" y="740" text-anchor="middle" fill="#8b949e" font-size="12">
    Flow: Internet → Packet Filtering (iptables/nftables) → Allowed traffic forwarded to LAN → Logged → Managed via Bash CLI or Flask Web UI
  </text>
</svg>
